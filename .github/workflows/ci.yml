name: CI

permissions: {}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CLAUDE_CODE_VERSION: 2.1.292

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate Plugin (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
          no-cache: true

      - name: Run validation suites
        run: bun scripts/validate.ts

      - name: Job summary
        if: always()
        run: |
          {
            echo "### What this job checks ($RUNNER_OS)"
            echo "Every validator group (manifests, frontmatter, docs, hook registration, the mod's registrations, the repository layout and the MCP handshake), via \`just validate\`. The engine checks skip here because the claude CLI is not installed; the Mod Tests job runs them."
            echo ""
            echo "### If this fails"
            echo "The plugin manifest, a hook definition, the mod's registrations or the repository layout is malformed or out of sync. Run \`just validate\` locally to see the exact failure."
          } >> "$GITHUB_STEP_SUMMARY"

  # OpenCode ships a native build for each of these runners, so its specs run on all three.
  test-opencode:
    name: OpenCode Adapter (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      # The omca MCP server OpenCode starts runs the ast-grep binary for its ast_* tools.
      - uses: ./.github/actions/ast-grep

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
          no-cache: true

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install OpenCode CLI
        run: npm i -g @opencode/cli@2.0.18

      # No bun install: the adapter imports @opencode/plugin for types only, which bun erases.
      - name: Specs, including the smoke and model-path runs against OpenCode
        run: bun test opencode/

      - name: Job summary
        if: always()
        run: |
          {
            echo "### What this job checks ($RUNNER_OS)"
            echo "The OpenCode adapter passes its unit tests and loads in a real OpenCode 2.0.18 install, via \`just test-opencode\`. The TypeScript job typechecks it."
            echo ""
            echo "### If this fails"
            echo "The adapter's prompt translation or its runtime wiring drifted from what OpenCode expects. Run \`just test-opencode\` locally with bun and opencode on PATH to see the exact failure."
          } >> "$GITHUB_STEP_SUMMARY"

  typescript:
    name: TypeScript Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    permissions:
      contents: read
    env:
      DISABLE_AUTOUPDATER: "1"
      BUN_SPEC_ROOTS: src servers statusline scripts benchmarks/compare
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
          no-cache: true

      # scripts/qa/install-verify.spec.ts runs `claude plugin validate` only when claude is on PATH.
      - name: Install Claude Code (Linux and macOS)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_CODE_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          [[ "$("$HOME/.local/bin/claude" --version)" == "$CLAUDE_CODE_VERSION "* ]]

      - name: Install Claude Code (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ([scriptblock]::Create((Invoke-RestMethod https://claude.ai/install.ps1))) $env:CLAUDE_CODE_VERSION
          $bin = Join-Path $env:USERPROFILE '.local\bin'
          Add-Content -Path $env:GITHUB_PATH -Value $bin -Encoding utf8
          $version = & (Join-Path $bin 'claude.exe') --version
          if ($version -notlike "$env:CLAUDE_CODE_VERSION *") { throw "installed claude reports '$version', expected $env:CLAUDE_CODE_VERSION" }

      # benchmarks/compare/cases.spec.ts skips its typecheck cases without node_modules/.bin/tsc.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun x --bun oxlint --deny-warnings src servers statusline scripts hooks opencode tests benchmarks/compare

      - name: Typecheck
        run: |
          bun x --bun tsc --noEmit -p tsconfig.json
          bun x --bun tsc --noEmit -p tsconfig.runtime.json
          bun x --bun tsc --noEmit -p opencode

      # servers/tools/ast.spec.ts runs the real ast-grep binary.
      - uses: ./.github/actions/ast-grep

      - name: Bun spec tests
        if: runner.os != 'Linux'
        run: bun test --parallel $BUN_SPEC_ROOTS --reporter=junit --reporter-outfile="$RUNNER_TEMP/bun-junit.xml"

      # Bun on Windows can crash mid-run and still exit 0 (bun issue 40376). The crash leaves no
      # report or a report missing spec files, so the run passes only when the report exists, has
      # no failures and lists every spec file under the roots the step above ran.
      - name: Check the spec run finished
        if: runner.os != 'Linux'
        run: bun scripts/qa/junit-complete.ts "$RUNNER_TEMP/bun-junit.xml" $BUN_SPEC_ROOTS

      # Linux runs the specs once, in this order instead of file order. A spec that passes only in
      # file order fails here. Bun prints the seed, and the step name carries it, so a failure reruns
      # locally with `bun test --parallel --randomize --seed=<seed>`.
      - name: Bun spec tests in random order (seed ${{ github.run_number }})
        if: runner.os == 'Linux'
        run: bun test --parallel --randomize --seed=${{ github.run_number }} $BUN_SPEC_ROOTS

      - name: Job summary
        if: always()
        run: |
          {
            echo "### What this job checks ($RUNNER_OS)"
            echo "The TypeScript hooks module and shared code on Claude Code $CLAUDE_CODE_VERSION: oxlint, the three tsc projects and the bun spec files in parallel, in file order with a check that the run listed every spec file on macOS and Windows, and in a seeded random order on Linux (mirrors \`just lint\`, \`typecheck\` and \`test\`)."
            echo ""
            echo "### If this fails"
            echo "A lint finding, a type error, a failing test, or a spec run that crashed or stopped before every spec file ran. Run the matching \`just\` recipe locally with Claude Code $CLAUDE_CODE_VERSION and bun 1.4.2 to see the exact failure."
          } >> "$GITHUB_STEP_SUMMARY"

  mod:
    name: Mod Tests and Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    permissions:
      contents: read
    env:
      DISABLE_AUTOUPDATER: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
          no-cache: true

      # The hooks module needs a client that loads mods, so the version is pinned and
      # asserted rather than taking whatever the installer serves as latest.
      - name: Install Claude Code (Linux and macOS)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_CODE_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          [[ "$("$HOME/.local/bin/claude" --version)" == "$CLAUDE_CODE_VERSION "* ]]

      - name: Install Claude Code (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ([scriptblock]::Create((Invoke-RestMethod https://claude.ai/install.ps1))) $env:CLAUDE_CODE_VERSION
          $bin = Join-Path $env:USERPROFILE '.local\bin'
          Add-Content -Path $env:GITHUB_PATH -Value $bin -Encoding utf8
          $version = & (Join-Path $bin 'claude.exe') --version
          if ($version -notlike "$env:CLAUDE_CODE_VERSION *") { throw "installed claude reports '$version', expected $env:CLAUDE_CODE_VERSION" }

      - name: Mod tests
        run: claude plugin test .

      - name: Check the mod against the engine
        run: bun scripts/validate.ts --check engine

      # The session still runs after a failed step above, so its result reports on its own.
      - name: Session against the mock model
        if: ${{ !cancelled() }}
        run: bun scripts/qa/ci-smoke.ts

      - name: Job summary
        if: always()
        run: |
          {
            echo "### What this job checks ($RUNNER_OS)"
            echo "The mod tests and the engine checks on Claude Code $CLAUDE_CODE_VERSION, the latter running \`claude plugin validate --strict\` on a packaged copy, then a real \`claude -p\` session with the packaged plugin loaded, against the mock model with a scratch project and config directory: the server answers omca_hook calls and the mod's tool.check guard denies a recursive removal (through PowerShell as well on Windows, when the session offers that tool). Mirrors \`just test-mod\`, \`validate --check engine\` and \`smoke\`."
            echo ""
            echo "### If this fails"
            echo "A failing mod test, a manifest or hooks-module validation error, or the plugin did not load in a real session on this OS, or its guard did not run. Run the matching \`just\` recipe locally with Claude Code $CLAUDE_CODE_VERSION on PATH; the smoke check quotes the debug log it reads."
          } >> "$GITHUB_STEP_SUMMARY"

  # The manifest checks read local files, so one runner is enough; the mod job runs them on every
  # OS with the pinned client. This job installs the latest published client instead, to catch
  # a manifest the newest platform schema rejects. The validator needs no authentication.
  validate-manifest:
    name: Manifest Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      DISABLE_AUTOUPDATER: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install Claude Code CLI
        run: npm i -g @anthropic-ai/claude-code

      - name: Validate the marketplace
        run: claude plugin validate . --strict

      - name: Validate the plugin manifest, its skills, agents and hooks module
        run: claude plugin validate .claude-plugin/plugin.json --strict

      - name: Job summary
        if: always()
        run: |
          {
            echo "### What this job checks"
            echo "The marketplace and the plugin manifest, with its skills, agents and hooks module, against the latest published client's schema, via \`claude plugin validate . --strict\` and \`claude plugin validate .claude-plugin/plugin.json --strict\`."
            echo ""
            echo "### If this fails"
            echo "A field in \`.claude-plugin/plugin.json\` or \`.claude-plugin/marketplace.json\`, or a skill, agent or hooks module, is malformed or unknown to the newest client. Run both commands locally with the latest claude CLI to see the exact failure."
          } >> "$GITHUB_STEP_SUMMARY"
