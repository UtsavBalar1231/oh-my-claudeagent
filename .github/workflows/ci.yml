name: CI

permissions: {}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The linux x64 archive of one ast-grep release; the digest is that archive's SHA-256, so a
# version bump changes both.
env:
  AST_GREP_VERSION: 0.45.3
  AST_GREP_SHA256: f8ac830881339d1edee6b2652f54798c0f4da5a827f2db38a08ee31117783ce8

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate Plugin
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Run validation suites
        run: bun scripts/validate.ts --check claims --check hooks --check mod --check tree --check engine

      - name: Job summary
        if: always()
        run: |
          {
            echo "### What this job checks"
            echo "Plugin claims (manifests, frontmatter, docs), hook registration, the mod's registrations and the repository layout, via \`just test\`. The engine checks skip here because the claude CLI is not installed; the TypeScript job runs them."
            echo ""
            echo "### If this fails"
            echo "The plugin manifest, a hook definition, the mod's registrations or the repository layout is malformed or out of sync. Run \`bun scripts/validate.ts --check claims --check hooks --check mod --check tree --check engine\` locally to see the exact failure."
          } >> "$GITHUB_STEP_SUMMARY"

  lint-shell:
    name: Lint Shell
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: ShellCheck
        run: shellcheck scripts/*.sh

      - name: Job summary
        if: always()
        run: |
          {
            echo "### What this job checks"
            echo "Shell script quality across scripts/*.sh, via shellcheck (mirrors \`just lint-shell\`)."
            echo ""
            echo "### If this fails"
            echo "A shell script has a shellcheck violation. Run \`just lint-shell\` locally to see the exact warning and file/line."
          } >> "$GITHUB_STEP_SUMMARY"

  test-mcp:
    name: MCP Server Specs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      # servers/tools/ast.spec.ts runs the real ast-grep binary.
      - name: Install ast-grep CLI
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/ast-grep.zip" "https://github.com/ast-grep/ast-grep/releases/download/$AST_GREP_VERSION/app-x86_64-unknown-linux-gnu.zip"
          echo "$AST_GREP_SHA256  $RUNNER_TEMP/ast-grep.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/ast-grep.zip" -d "$RUNNER_TEMP/ast-grep"
          echo "$RUNNER_TEMP/ast-grep" >> "$GITHUB_PATH"

      - name: Run MCP server specs
        run: bun test servers

      - name: Check the MCP handshake against the real server
        run: bun scripts/validate.ts --check mcp

      - name: Job summary
        if: always()
        run: |
          {
            echo "### What this job checks"
            echo "The omca MCP server specs under servers/: the handshake, the tool list, every tool and every hook handler, plus the validator's handshake against the real server, via \`just test-mcp\`."
            echo ""
            echo "### If this fails"
            echo "A server spec failed: the server did not start, misreports its tool list, or a tool or hook handler regressed. Run \`just test-mcp\` locally to see the failing spec."
          } >> "$GITHUB_STEP_SUMMARY"

  test-opencode:
    name: OpenCode Adapter
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      # The omca MCP server OpenCode starts runs the ast-grep binary for its ast_* tools.
      - name: Install ast-grep CLI
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/ast-grep.zip" "https://github.com/ast-grep/ast-grep/releases/download/$AST_GREP_VERSION/app-x86_64-unknown-linux-gnu.zip"
          echo "$AST_GREP_SHA256  $RUNNER_TEMP/ast-grep.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/ast-grep.zip" -d "$RUNNER_TEMP/ast-grep"
          echo "$RUNNER_TEMP/ast-grep" >> "$GITHUB_PATH"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0

      - name: Install OpenCode CLI
        run: npm i -g @opencode/cli@2.0.18

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun test opencode/

      - name: Smoke test
        run: bash opencode/test/smoke.sh

      - name: Model path test
        run: bash opencode/test/model-path.sh

      - name: Job summary
        if: always()
        run: |
          {
            echo "### What this job checks"
            echo "The OpenCode adapter typechecks, passes its unit tests, and loads in a real OpenCode 2.0.18 install, via the commands in \`just test-opencode\`."
            echo ""
            echo "### If this fails"
            echo "The adapter's prompt translation or its runtime wiring drifted from what OpenCode expects. Run \`just test-opencode\` locally with bun and opencode on PATH to see the exact failure."
          } >> "$GITHUB_STEP_SUMMARY"

  typescript:
    name: TypeScript Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DISABLE_AUTOUPDATER: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      # The hooks module needs a client that loads mods, so the version is pinned and
      # asserted rather than taking whatever the installer serves as latest.
      - name: Install Claude Code 2.1.287
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s 2.1.287
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          [[ "$("$HOME/.local/bin/claude" --version)" == 2.1.287\ * ]]

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: |
          bun x tsc --noEmit -p tsconfig.json
          bun x tsc --noEmit -p tsconfig.runtime.json

      - name: Mod tests
        run: claude plugin test .

      # servers/tools/ast.spec.ts runs the real ast-grep binary.
      - name: Install ast-grep CLI
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/ast-grep.zip" "https://github.com/ast-grep/ast-grep/releases/download/$AST_GREP_VERSION/app-x86_64-unknown-linux-gnu.zip"
          echo "$AST_GREP_SHA256  $RUNNER_TEMP/ast-grep.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/ast-grep.zip" -d "$RUNNER_TEMP/ast-grep"
          echo "$RUNNER_TEMP/ast-grep" >> "$GITHUB_PATH"

      - name: Bun spec tests
        run: bun test src servers statusline scripts opencode

      - name: Validate manifest and hooks module
        run: claude plugin validate .claude-plugin/plugin.json --strict

      - name: Check the mod against the engine
        run: bun scripts/validate.ts --check engine

      - name: Job summary
        if: always()
        run: |
          {
            echo "### What this job checks"
            echo "The TypeScript hooks module and shared code on Claude Code 2.1.287: both tsc projects, the mod tests, the bun spec files, \`claude plugin validate\` on the manifest, and the engine checks on its output (mirrors \`just typecheck-ts test-mod test-bun validate-mod\`)."
            echo ""
            echo "### If this fails"
            echo "A type error, a failing test, or a manifest or hooks-module validation error. Run the matching \`just\` recipe locally with Claude Code 2.1.287 and bun 1.4.2 to see the exact failure."
          } >> "$GITHUB_STEP_SUMMARY"

  validate-manifest:
    name: Manifest Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0

      # `just validate-manifest` skips itself when the claude CLI is absent, so CI
      # installs the CLI to make the step enforce rather than no-op. The validator
      # reads local files only and needs no authentication.
      - name: Install Claude Code CLI
        run: npm i -g @anthropic-ai/claude-code

      - name: Validate plugin manifest
        run: claude plugin validate . --strict

      - name: Validate plugin manifest, skills, and agents
        run: claude plugin validate .claude-plugin/plugin.json

      - name: Job summary
        if: always()
        run: |
          {
            echo "### What this job checks"
            echo "The plugin manifest against the platform's own schema, by running \`claude plugin validate . --strict\` directly. The \`just validate-manifest\` recipe skips itself when the CLI is absent, so this job installs the CLI and calls the validator rather than the recipe."
            echo ""
            echo "### If this fails"
            echo "A field in \`.claude-plugin/plugin.json\` or \`.claude-plugin/marketplace.json\` is malformed or unknown to the installed CLI. Run \`claude plugin validate . --strict\` locally to see the exact failure."
          } >> "$GITHUB_STEP_SUMMARY"
