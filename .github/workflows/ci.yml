name: CI

permissions: {}

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate Plugin
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Run validation suites
        run: bash scripts/validate-plugin.sh --check claims --check hooks

      - name: Job summary
        if: always()
        run: |
          {
            echo "### What this job checks"
            echo "Plugin claims (manifest/schema) and hook registration, via \`just test\`."
            echo ""
            echo "### If this fails"
            echo "The plugin manifest or a hook definition is malformed or out of sync. Run \`bash scripts/validate-plugin.sh --check claims --check hooks\` locally to see the exact failure."
          } >> "$GITHUB_STEP_SUMMARY"

  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Install ruff
        run: uv tool install ruff

      - name: Check formatting (servers)
        run: ruff format --check servers/

      - name: Check formatting (statusline)
        run: ruff format --check statusline/

      - name: Lint (servers)
        run: ruff check servers/

      - name: Lint (statusline)
        run: ruff check statusline/

      - name: Job summary
        if: always()
        run: |
          {
            echo "### What this job checks"
            echo "Python formatting and lint rules for servers/ and statusline/, via ruff (mirrors \`just fmt-check lint-python\`). Each directory keeps its own ruff config (py310 vs py312 target-version)."
            echo ""
            echo "### If this fails"
            echo "A file is unformatted or violates a ruff rule. Run \`just fmt\` and \`just lint-python\` locally to fix."
          } >> "$GITHUB_STEP_SUMMARY"

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      # pyright's PyPI wrapper runs the real (Node-based) pyright binary under the
      # hood, downloading/invoking Node at execution time -- so Node must be on PATH.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0

      - name: Install typecheck dependencies
        run: uv sync --project servers --group dev

      - name: Run pyright
        run: uv run --project servers pyright

      - name: Job summary
        if: always()
        run: |
          {
            echo "### What this job checks"
            echo "Static types across servers/ and statusline/, via pyright (mirrors \`just typecheck\`)."
            echo ""
            echo "### If this fails"
            echo "A type error was introduced. Run \`just typecheck\` locally to see the exact file/line."
          } >> "$GITHUB_STEP_SUMMARY"

  lint-shell:
    name: Lint Shell
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: ShellCheck
        run: shellcheck scripts/*.sh scripts/qa/*.sh scripts/qa/lib/*.sh

      - name: Job summary
        if: always()
        run: |
          {
            echo "### What this job checks"
            echo "Shell script quality across scripts/*.sh and scripts/qa/**/*.sh, via shellcheck (mirrors \`just lint-shell\`)."
            echo ""
            echo "### If this fails"
            echo "A hook or qa-harness script has a shellcheck violation. Run \`just lint-shell\` locally to see the exact warning and file/line."
          } >> "$GITHUB_STEP_SUMMARY"

  test-bats:
    name: BATS Hook Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: true

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Pre-warm omca MCP venv
        run: uv sync --project servers

      - name: Install ast-grep CLI
        run: uv tool install ast-grep-cli

      - name: Run BATS behavioral tests
        run: tests/bats/bats-core/bin/bats tests/bats/hooks/ tests/bats/unit/

      - name: Job summary
        if: always()
        run: |
          {
            echo "### What this job checks"
            echo "Hook script and shared-library behavior under tests/bats/hooks/ and tests/bats/unit/, via bats-core (mirrors \`just test-bats\`)."
            echo ""
            echo "### If this fails"
            echo "A hook script or a common.sh helper regressed. Run \`tests/bats/bats-core/bin/bats tests/bats/hooks/ tests/bats/unit/\` locally (after \`git submodule update --init\`) to see the failing test."
          } >> "$GITHUB_STEP_SUMMARY"

  test-pytest:
    name: pytest MCP Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Install test dependencies
        run: uv sync --project servers --group dev

      # The startup-latency and signal-shutdown tests spawn the real omca MCP
      # server, whose entry point calls discover_binary() and exits 1 if ast-grep
      # is absent — so the server must have ast-grep on PATH to reply to initialize.
      - name: Install ast-grep CLI
        run: uv tool install ast-grep-cli

      - name: Run pytest
        run: uv run --project servers pytest servers/tests/ -v --tb=short

      - name: Job summary
        if: always()
        run: |
          {
            echo "### What this job checks"
            echo "MCP tool unit tests under servers/tests/, via pytest (mirrors \`just test-pytest\`)."
            echo ""
            echo "### If this fails"
            echo "An MCP tool's behavior regressed. Run \`uv run --project servers pytest servers/tests/ -v --tb=short\` locally to see the failing test and traceback."
          } >> "$GITHUB_STEP_SUMMARY"

  test-mcp:
    name: MCP Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      # validate-plugin.sh --check mcp starts the real omca MCP server, whose
      # entry point calls discover_binary() and exits 1 if ast-grep is absent.
      - name: Install ast-grep CLI
        run: uv tool install ast-grep-cli

      - name: Run MCP validation
        run: bash scripts/validate-plugin.sh --check mcp

      - name: Job summary
        if: always()
        run: |
          {
            echo "### What this job checks"
            echo "The omca MCP server starts and responds to initialize/list-tools, via \`just test-mcp\`."
            echo ""
            echo "### If this fails"
            echo "The MCP server failed to start or misreports its tool list, often due to a missing ast-grep binary or a broken tool registration. Run \`bash scripts/validate-plugin.sh --check mcp\` locally to see the exact failure."
          } >> "$GITHUB_STEP_SUMMARY"
