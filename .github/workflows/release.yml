name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  ci:
    name: CI
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release:
    name: Create Release
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate every version field matches the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          failed=0
          for field in ".claude-plugin/plugin.json .version" ".claude-plugin/marketplace.json .metadata.version" ".claude-plugin/marketplace.json .plugins[0].version" "package.json .version"; do
            read -r file query <<< "$field"
            actual="$(jq -r "$query" "$file")"
            if [[ "$actual" != "$version" ]]; then
              echo "::error::$file $query is $actual, the tag says $version"
              failed=1
            fi
          done
          exit "$failed"

      - name: Take the release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$version]" 'index($0, heading) == 1 { found = 1; next } found && /^## \[/ { exit } found { print }' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no ## [$version] section, or it is empty"
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --notes-file "$RUNNER_TEMP/notes.md" --latest

      - name: Job summary
        if: always()
        run: |
          {
            echo "### What this job checks"
            echo "The tag's version matches plugin.json, both version fields of marketplace.json and package.json, then the GitHub release is created with the tag's CHANGELOG.md section as its notes (runs only after every CI job passes)."
            echo ""
            echo "### If this fails"
            echo "A version field disagrees with the tag, CHANGELOG.md has no section for the version, or the release creation step failed. The step logs above name which one."
          } >> "$GITHUB_STEP_SUMMARY"
