name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate Plugin
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Run validation
        run: bash scripts/validate-plugin.sh --check claims --check hooks

      - name: Job summary
        if: always()
        run: |
          {
            echo "### What this job checks"
            echo "Plugin claims (manifest/schema) and hook registration, via \`just test\`."
            echo ""
            echo "### If this fails"
            echo "The plugin manifest or a hook definition is malformed or out of sync. This gate must pass before a release is created."
          } >> "$GITHUB_STEP_SUMMARY"

  test-bats:
    name: BATS Hook Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: true

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: false

      - name: Pre-warm omca MCP venv
        run: uv sync --project servers

      - name: Install ast-grep CLI
        run: uv tool install ast-grep-cli

      - name: Run BATS behavioral tests
        run: tests/bats/bats-core/bin/bats tests/bats/hooks/ tests/bats/unit/

      - name: Job summary
        if: always()
        run: |
          {
            echo "### What this job checks"
            echo "Hook script and shared-library behavior under tests/bats/hooks/ and tests/bats/unit/, via bats-core (mirrors \`just test-bats\`)."
            echo ""
            echo "### If this fails"
            echo "A hook script or a common.sh helper regressed. This gate must pass before a release is created."
          } >> "$GITHUB_STEP_SUMMARY"

  test-pytest:
    name: pytest MCP Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: false

      - name: Install test dependencies
        run: uv sync --project servers --group dev

      # The startup-latency and signal-shutdown tests spawn the real omca MCP
      # server, whose entry point calls discover_binary() and exits 1 if ast-grep
      # is absent — so the server must have ast-grep on PATH to reply to initialize.
      - name: Install ast-grep CLI
        run: uv tool install ast-grep-cli

      - name: Run pytest
        run: uv run --project servers pytest servers/tests/ -v --tb=short

      - name: Job summary
        if: always()
        run: |
          {
            echo "### What this job checks"
            echo "MCP tool unit tests under servers/tests/, via pytest (mirrors \`just test-pytest\`)."
            echo ""
            echo "### If this fails"
            echo "An MCP tool's behavior regressed. This gate must pass before a release is created."
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Create Release
    needs: [validate, test-bats, test-pytest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Validate version matches tag
        run: |
          PLUGIN_VERSION=$(jq -r '.version' .claude-plugin/plugin.json)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$PLUGIN_VERSION" != "$TAG_VERSION" ]]; then
            echo "::error::plugin.json version ($PLUGIN_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --latest

      - name: Job summary
        if: always()
        run: |
          {
            echo "### What this job checks"
            echo "Tag version matches plugin.json, then creates the GitHub release (runs only after validate, test-bats, and test-pytest all pass)."
            echo ""
            echo "### If this fails"
            echo "Either the tag/version mismatch check failed, or the release creation step failed. Check the step logs above for which one."
          } >> "$GITHUB_STEP_SUMMARY"
