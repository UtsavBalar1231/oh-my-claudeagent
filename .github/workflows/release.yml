name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate Plugin
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
          no-cache: true

      - name: Run validation
        run: bash scripts/validate-plugin.sh --check claims --check hooks

      - name: Job summary
        if: always()
        run: |
          {
            echo "### What this job checks"
            echo "Plugin claims (manifest/schema) and hook registration, via \`just test\`."
            echo ""
            echo "### If this fails"
            echo "The plugin manifest or a hook definition is malformed or out of sync. This gate must pass before a release is created."
          } >> "$GITHUB_STEP_SUMMARY"

  test-bats:
    name: BATS Hook Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          submodules: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
          no-cache: true

      - name: Run BATS behavioral tests
        run: tests/bats/bats-core/bin/bats tests/bats/hooks/ tests/bats/unit/

      - name: Job summary
        if: always()
        run: |
          {
            echo "### What this job checks"
            echo "The validator's golden replay under tests/bats/hooks/ and the workflow, frontmatter and registration contracts under tests/bats/unit/, via bats-core (mirrors \`just test-bats\`)."
            echo ""
            echo "### If this fails"
            echo "The validator output or a workflow, frontmatter or registration contract drifted. This gate must pass before a release is created."
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Create Release
    needs: [validate, test-bats]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Validate version matches tag
        run: |
          PLUGIN_VERSION=$(jq -r '.version' .claude-plugin/plugin.json)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$PLUGIN_VERSION" != "$TAG_VERSION" ]]; then
            echo "::error::plugin.json version ($PLUGIN_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --latest

      - name: Job summary
        if: always()
        run: |
          {
            echo "### What this job checks"
            echo "Tag version matches plugin.json, then creates the GitHub release (runs only after validate and test-bats both pass)."
            echo ""
            echo "### If this fails"
            echo "Either the tag/version mismatch check failed, or the release creation step failed. Check the step logs above for which one."
          } >> "$GITHUB_STEP_SUMMARY"
