name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  ci:
    name: CI
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release:
    name: Create Release
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Validate version matches tag
        run: |
          PLUGIN_VERSION=$(jq -r '.version' .claude-plugin/plugin.json)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$PLUGIN_VERSION" != "$TAG_VERSION" ]]; then
            echo "::error::plugin.json version ($PLUGIN_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --latest

      - name: Job summary
        if: always()
        run: |
          {
            echo "### What this job checks"
            echo "Tag version matches plugin.json, then creates the GitHub release (runs only after every CI job passes)."
            echo ""
            echo "### If this fails"
            echo "Either the tag/version mismatch check failed, or the release creation step failed. Check the step logs above for which one."
          } >> "$GITHUB_STEP_SUMMARY"
