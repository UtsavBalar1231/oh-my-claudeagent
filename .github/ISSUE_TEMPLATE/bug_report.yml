name: Bug report
description: Report something that does not work as expected
labels: [bug]
body:
  - type: input
    id: claude-version
    attributes:
      label: Claude Code version
      description: Output of `claude --version`
    validations:
      required: true
  - type: input
    id: omca-version
    attributes:
      label: OMCA version
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: /omca doctor output
      render: text
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
