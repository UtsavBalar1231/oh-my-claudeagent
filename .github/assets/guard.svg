="#949494" xml:space="preserve">●</text><text x="34" y="171" textLength="225" lengthAdjust="spacing" xml:space="preserve">Removing the build output</text><text x="34" y="191" fill="#949494" textLength="153" lengthAdjust="spacing" xml:space="preserve">└  $ rm -rf build</text><text x="16" y="211" fill="#949494" textLength="1080" lengthAdjust="spacing" xml:space="preserve">────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────</text><text x="25" y="231" fill="#000000" xml:space="preserve">☐</text><text x="43" y="231" fill="#000000" textLength="90" lengthAdjust="spacing" xml:space="preserve">OMCA guard</text><text x="16" y="271" opacity="0.6" xml:space="preserve">│</text><text x="34" y="271" fill="#ffffff" font-weight="700" textLength="351" lengthAdjust="spacing" xml:space="preserve">OMCA held this command for your review:</text><text x="16" y="291" opacity="0.6" xml:space="preserve">│</text><text x="52" y="291" fill="#ffffff" font-weight="700" textLength="108" lengthAdjust="spacing" xml:space="preserve">rm -rf build</text><text x="16" y="311" opacity="0.6" xml:space="preserve">│</text><text x="34" y="311" fill="#ffffff" font-weight="700" textLength="144" lengthAdjust="spacing" xml:space="preserve">It would remove:</text><text x="16" y="331" opacity="0.6" xml:space="preserve">│</text><text x="52" y="331" fill="#ffffff" font-weight="700" textLength="189" lengthAdjust="spacing" xml:space="preserve">build  dir, 4 entries</text><text x="16" y="351" opacity="0.6" xml:space="preserve">│</text><text x="34" y="351" fill="#ffffff" font-weight="700" textLength="63" lengthAdjust="spacing" xml:space="preserve">Run it?</text><text x="16" y="391" fill="#afd7ff" xml:space="preserve">❯</text><text x="34" y="391" fill="#949494" textLength="18" lengthAdjust="spacing" xml:space="preserve">1.</text><text x="61" y="391" fill="#afd7ff" textLength="54" lengthAdjust="spacing" xml:space="preserve">Refuse</text><text x="34" y="411" fill="#949494" textLength="18" lengthAdjust="spacing" xml:space="preserve">2.</text><text x="61" y="411" textLength="54" lengthAdjust="spacing" xml:space="preserve">Run it</text><text x="34" y="431" fill="#949494" textLength="162" lengthAdjust="spacing" xml:space="preserve">3. Type something.</text><text x="16" y="451" fill="#949494" textLength="1080" lengthAdjust="spacing" xml:space="preserve">────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────</text><text x="34" y="471" textLength="162" lengthAdjust="spacing" xml:space="preserve">4. Chat about this</text><text x="16" y="511" fill="#949494" textLength="441" lengthAdjust="spacing" xml:space="preserve">Enter to select · ↑/↓ to navigate · Esc to cancel</text><text x="16" y="531" fill="#af87d7" textLength="846" lengthAdjust="spacing" xml:space="preserve">──────────────────────────────────────────────────────────────────────────────────────────────</text><text x="871" y="531" fill="#000000" textLength="207" lengthAdjust="spacing" xml:space="preserve">OMCA: checkout-redesign</text><text x="1087" y="531" fill="#af87d7" xml:space="preserve">─</text></svg>
