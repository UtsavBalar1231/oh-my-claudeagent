ci:
  autofix_commit_msg: "ci: auto-fix from pre-commit hooks"
  autofix_prs: true
  autoupdate_commit_msg: "ci: pre-commit autoupdate"
  autoupdate_schedule: weekly
  skip: [zizmor, typecheck-ts]

# Engine-generated type snapshot: committed byte for byte as the client writes it.
exclude: '^\.claude-plugin/types/'

repos:
  # General hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.patch$'
      - id: end-of-file-fixer
        exclude: '\.patch$'
      - id: check-merge-conflict
      - id: check-json
        # These fixtures are deliberately malformed: the boulder resolver's
        # corrupt and half-written registry cases, a torn ledger record the
        # Stats tab must skip, and the settings file status line setup must refuse.
        # .oxlintrc.json is JSON with comments, which oxlint reads and this check cannot.
        exclude: '^tests/fixtures/boulder-schemas/(corrupt|half-written)\.json$|^tests/fixtures/settings/malformed\.json$|^tests/mod/visual/fixtures/stats/\.omca/metrics/b83e5d10-7a42-4f6c-8e19-c5a0d2f4e902/a8f2a0c4e6b84d10\.json$|^\.oxlintrc\.json$'
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  # GHA workflow validation
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.37.1
    hooks:
      - id: check-github-workflows

  # GHA security scanning
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.24.1
    hooks:
      - id: zizmor

  # Both tsc projects, the same check CI runs; the recipe needs bun and just on PATH
  - repo: local
    hooks:
      - id: typecheck-ts
        name: typecheck-ts
        entry: just typecheck-ts
        language: system
        files: '\.tsx?$|^tsconfig[^/]*\.json$|^package\.json$'
        pass_filenames: false
